<div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start p-4">

  <div cdkDropListGroup class="col-span-1 md:col-span-1 px-4 py-2 border-r border-gray-300 w-full md:w-60">
    <div class="flex justify-center">
      <h2 class="text-lg font-bold text-gray-700 mb-4">Tools</h2>
    </div>
    <div
      cdkDropList
      [cdkDropListData]="dataSource"
      [cdkDropListConnectedTo]="[acquiredItems]"
      class="border border-gray-300 min-h-[60px] bg-white rounded overflow-hidden block"
    >
      <cdk-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <cdk-nested-tree-node *cdkTreeNodeDef="let node" class="block pl-10">
          <div
            cdkDrag
            [cdkDragData]="node"
            class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white p-1 rounded mb-2 shadow text-sm w-32">
            {{ node.name }}
          </div>
        </cdk-nested-tree-node>
        <cdk-nested-tree-node *cdkTreeNodeDef="let node; when: hasChild">
          <div class="flex items-center space-x-2">
            <button
              [attr.aria-label]="'Toggle ' + node.name"
              cdkTreeNodeToggle
              class="focus:outline-none"
            >
              <img src="../../../assets/icons/check.svg" alt="Toggle Icon" height="32" width="32">
            </button>
            <span class="text-md font-semibold">{{ node.name }}</span>
          </div>
          <div
            class="pl-4 mt-2 pb-2"
            [class.hidden]="!treeControl.isExpanded(node)"
          >
            <ng-container cdkTreeNodeOutlet></ng-container>
          </div>
        </cdk-nested-tree-node>
      </cdk-tree>
    </div>
  </div>

  <!-- Editor  -->
  <div class="col-span-3 px-4 py-6 bg-gray-50 rounded-lg shadow-lg border border-gray-300"
      cdkDropList
      #acquiredItems="cdkDropList"
      [cdkDropListData]="editorItems"
      (cdkDropListDropped)="onEditorDrop($event)">
    <div class="flex justify-center">
      <h2 class="text-xl font-bold text-gray-700 mb-4">Editor</h2>
    </div>
    <h3 *ngIf="formTitle" class="text-lg text-center text-gray-800 mb-4">{{ formTitle }}</h3>
    
    <ng-container *ngIf="editorItems.length === 0">
      <div class="p-35 border-2 border-dashed border-gray-300 rounded-lg text-center text-gray-500">
        Drag and drop items here.
      </div>
    </ng-container>


    <ng-template #recursiveSection let-items="items">
      <div *ngFor="let item of items" class="mb-4">
        <ng-container [ngSwitch]="item?.type">
          <!-- Section -->
          <ng-container *ngSwitchCase="'Section'">
            <div cdkDrag class="bg-white p-4 rounded-lg shadow-md">
              <div class="flex justify-between items-center mb-2">
                <h3 class="font-semibold text-gray-700">{{ item.title || 'Section' }}</h3>
                <button (click)="removeItem(item)" class="text-red-500 hover:text-red-700">
                  <fa-icon [icon]="['fas', 'trash-alt']"></fa-icon>
                </button>
              </div>
              <div cdkDropList
                  [cdkDropListData]="item.items || []"
                  (cdkDropListDropped)="onSectionItemDropped($event, item)"
                  class="min-h-[50px] p-2 border-2 border-dashed border-gray-200 rounded-lg">
                <ng-container *ngTemplateOutlet="recursiveSection; context: { items: item.items || [] }"></ng-container>
              </div>
            </div>
          </ng-container>

          <!-- Form  -->
          <ng-container *ngSwitchDefault>
            <div class="bg-white p-3 rounded shadow-sm relative">
              <!-- Text Field -->
              <ng-container *ngIf="item?.type === 'TEXTFIELD'">
                <app-textform [label]="item.config.label" 
                            [textName]="item.config.textName"
                            [type]="item.config.type" 
                            [placeholder]="item.config.placeholder"
                      >
                </app-textform>
              </ng-container>

              <!-- Password Field -->
              <ng-container *ngIf="item?.type === 'password'">
                <app-password>
                </app-password>
              </ng-container>

              <!-- Email -->
              <ng-container *ngIf="item?.type === 'email'">
                <app-email [label]="item.config.label" 
                         [placeholder]="item.config.placeholder"
                         [labelPosition]="item.config.labelPosition"
                         [labelAlignment]="item.config.labelAlignment">
                </app-email>
              </ng-container>

              <!-- Checkbox Group -->
              <ng-container *ngIf="item?.type === 'checkbox-group'">
                <app-checkbox [groupLabel]="item.config.groupLabel"
                            [name]="item.config.name" 
                            [options]="item.config.options">
                </app-checkbox>
              </ng-container>
              
              <!-- Phone Number -->
              <ng-container *ngIf="item?.type === 'number'">
                <app-phone-number [label]="item.config.label"
                                [placeholder]="item.config.placeholder">
                </app-phone-number>
              </ng-container>

              <ng-container *ngIf="item?.type === 'textarea'">
                <app-text-area [label]="item.label">
                </app-text-area>
              </ng-container>
              
              <!-- Radio Group -->
              <ng-container *ngIf="item?.type === 'radio-group'">
                <app-radio-button
                  [groupLabel]="item.config.groupLabel"
                  [name]="item.config.name"
                  [options]="item.config.options"
                  [isRequired]="item.config.isRequired"
                  [isDisabled]="item.config.isDisabled"
                  [selectedOption]="item.config.selectedOption">
                </app-radio-button>
              </ng-container>
              
              <!-- Select Box -->
              <ng-container *ngIf="item?.type === 'selectbox'">
                <app-select-box
                  [label]="item.config.labelText"
                  [options]="getOptionsArray(item.config.options)">
                </app-select-box>
              </ng-container>
              
              <!-- Date Picker -->
              <ng-container *ngIf="item?.type === 'datepicker'">
                <app-datepicker [label]="item.config.label">
                </app-datepicker>
              </ng-container>

              <!-- Basic Date Picker -->
              <ng-container *ngIf="item?.type === 'basic-datepicker'">
                <app-basic-datepicker [label]="item.config.label">
                </app-basic-datepicker>
              </ng-container>

              <!-- Button -->
              <ng-container *ngIf="item?.type === 'button'">
                <app-button
                  [label]="item.config.label"
                  [type]="item.config.type"
                  (buttonClick)="handleButtonClick(item.config.type)">
                </app-button>
              </ng-container>

              <!-- Delete Button -->
              <button (click)="removeItem(item)" class="absolute top-2 right-2 text-red-500 hover:text-red-700">
                <fa-icon [icon]="['fas', 'trash-alt']"></fa-icon>
              </button>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </ng-template>

    <ng-container *ngTemplateOutlet="recursiveSection; context: { items: editorItems }">
    </ng-container>

    <div *ngIf="editorItems.length > 0" class="flex justify-start mt-4">
      <app-button
        label="Submit"
        type="submit"
        (buttonClick)="handleSubmit()"
        class="text-white bg-green-500 hover:bg-green-600 p-2 rounded">
      </app-button>
    </div>
  </div>
</div>

<!-- JSON Preview -->
<pre class="mt-4 p-4 bg-gray-100 rounded-lg shadow-inner overflow-auto">{{ editorItems | json }}</pre>

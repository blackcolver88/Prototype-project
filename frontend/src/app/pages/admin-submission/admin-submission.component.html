<div class="admin-submission-container">
  <div class="table-wrapper">
    <div class="action-bar">
      <div class="button-container">
        <!-- You can add action buttons here if needed -->
      </div>
      <div class="pagination-controls">
        <div class="items-per-page">
          <label for="itemsPerPage">Items per page:</label>
          <select id="itemsPerPage" [(ngModel)]="itemsPerPage" (change)="onPageSizeChange()">
            <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
          </select>
        </div>
      </div>
    </div>
    <table class="submission-table">
      <thead>
        <tr>
          <th class="table-header">Form Title</th>
          <th class="table-header">User</th>
          <th class="table-header">Date</th>
          <th class="table-header">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let submission of submissions" class="submission-row">
          <td class="table-cell">{{ submission.formTitle || 'Formulaire inconnu' }}</td>
          <td class="table-cell">{{ submission.task || 'Tâche inconnue' }}</td>
          <td class="table-cell">{{ submission.date | date:'medium' }}</td>
          <td class="table-cell">
            <button (click)="showFormResponses(submission.id)" class="btn-show" title="View Details">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3.5"/>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" *ngIf="totalPages > 0">
    <div class="pagination-info">
      Showing {{ (currentPage - 1) * itemsPerPage + 1 }} to {{ getMaxItems() }} of {{ totalItems }} entries
    </div>
    <div class="pagination-buttons">
      <button class="pagination-button" [disabled]="currentPage === 1" (click)="goPreviousPage()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <ng-container *ngFor="let page of getPaginationArray()">
        <span *ngIf="page < 0" class="pagination-ellipsis">...</span>
        <button *ngIf="page > 0"
                class="pagination-button"
                [class.active]="currentPage === page"
                (click)="onPageChange(page)">
          {{ page }}
        </button>
      </ng-container>

      <button class="pagination-button" [disabled]="isLastPage()" (click)="goNextPage()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="admin-submission-container">
  <table class="submission-table">
    <thead>
      <tr>
        <th>Forms title</th>
        <th>User</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let submission of submissions">
        <td>{{ submission.formTitle || 'Formulaire inconnu' }}</td>
        <td>{{ submission.task || 'Tâche inconnue' }}</td>
        <td>{{ submission.date | date:'medium' }}</td>
        <td>
          <button (click)="showFormResponses(submission.id)" class="btn-show">Détails</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination-container">
    <button (click)="goPreviousPage()" [disabled]="currentPage === 1">Précédent</button>
    <button (click)="goNextPage()" [disabled]="isLastPage()">Suivant</button>

    <pagination-controls
      id="custom-pagination-id"
      (pageChange)="onPageChange($event)"
      previousLabel="Précédent"
      nextLabel="Suivant"
      [maxSize]="7"
      [directionLinks]="true"
      [autoHide]="true"
      [responsive]="true"    
    ></pagination-controls>
  </div>
</div>

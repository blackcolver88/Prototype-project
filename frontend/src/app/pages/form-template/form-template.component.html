<div class="mt-5 mx-auto mr-5 max-w-[80%] transform -translate-x-[10%]">
  <ng-container *ngIf="isBrowser" class="z-4">
    <!-- Button styled similarly to the heading in the second code -->
    <div class="flex justify-center mb-4">
      <button type="button" (click)="openDialog()" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Add new form
      </button>
    </div>

    <!-- Grid table with the same vertical spacing as the second code -->
    <div class="flex justify-center w-full mt-4"> <!-- Added mt-4 for consistent spacing -->
      <ag-grid-angular
        class="ag-theme-quartz"
        style="height: 500px; width: 90%;"
        [rowData]="rowData"
        [columnDefs]="colDefs"
        [rowSelection]="'single'">
      </ag-grid-angular>
    </div>
  </ng-container>
</div>

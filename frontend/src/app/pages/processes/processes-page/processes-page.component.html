<div class="mt-5 mx-auto mr-5 max-w-[80%] transform -translate-x-[10%]">
  <ng-container *ngIf="isBrowser">
    <div class="flex justify-between mb-4">
      <h2 class="text-2xl font-bold">Process Definitions</h2>
      <button type="button" (click)="createNewProcess()" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Create New Process
      </button>
    </div>

    <div class="flex justify-center w-full mt-4"> 
      <ag-grid-angular
        class="ag-theme-quartz"
        style="height: 500px; width: 100%;"
        [rowData]="rowData"
        [columnDefs]="colDefs"
        [rowSelection]="'single'"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </ng-container>
</div>

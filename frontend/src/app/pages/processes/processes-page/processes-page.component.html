<div class="processes-container">
  <ng-container *ngIf="isBrowser">
    <div class="table-wrapper">
      <div class="create-btn-center">
        <button type="button" (click)="createNewProcess()" class="btn-add">
          <span class="btn-icon">+</span> Create New Process
        </button>
      </div>
      <div class="action-bar">
        <div class="pagination-controls">
          <div class="items-per-page">
            <label for="itemsPerPage">Items per page:</label>
            <select id="itemsPerPage" [(ngModel)]="itemsPerPage" (change)="onPageSizeChange()">
              <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
            </select>
          </div>
        </div>
      </div>

      <table class="processes-table" *ngIf="displayData.length > 0">
        <thead>
          <tr>
            <!-- <th class="table-header">ID</th> -->
            <th class="table-header">Name</th>
            <th class="table-header">Key</th>
            <th class="table-header">Version</th>
            <!-- <th class="table-header">Deployment ID</th> -->
            <th class="table-header">Edit</th>
            <th class="table-header">Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let process of displayData" class="process-row">
            <!-- <td class="table-cell">{{ process.id }}</td> -->
            <td class="table-cell">{{ process.name }}</td>
            <td class="table-cell">{{ process.key }}</td>
            <td class="table-cell">{{ process.version }}</td>
            <!-- <td class="table-cell">{{ process.deploymentId }}</td> -->
            <td class="table-cell">
              <button (click)="handleEditClick(process.id)" class="btn-edit" title="Edit Process">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
            </td>
            <td class="table-cell">
              <button (click)="handleDeleteClick(process.id, process.deploymentId)" class="btn-delete" title="Delete Process">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination" *ngIf="totalPages > 0">
        <div class="pagination-info">
          Showing {{ (currentPage - 1) * itemsPerPage + 1 }} to {{ getMaxItems() }} of {{ rowData.length }} entries
        </div>
        <div class="pagination-buttons">
          <button class="pagination-button" [disabled]="currentPage === 1" (click)="previousPage()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <ng-container *ngFor="let page of getPaginationArray()">
            <span *ngIf="page < 0" class="pagination-ellipsis">...</span>
            <button *ngIf="page > 0"
                    class="pagination-button"
                    [class.active]="currentPage === page"
                    (click)="goToPage(page)">
              {{ page }}
            </button>
          </ng-container>

          <button class="pagination-button" [disabled]="isLastPage()" (click)="nextPage()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </ng-container>
</div>

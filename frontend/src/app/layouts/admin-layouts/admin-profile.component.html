<div class="card">
  <div class="flex flex-col md:flex-row gap-8">

    <div class="flex flex-col items-center justify-center w-full md:w-40 mx-auto">
      <div class="flex justify-center items-center">
        <img 
          [src]="photoUrl || 'assets/default-user.png'" 
          alt="Profile photo" 
          class="rounded-full object-cover w-32 h-32 border-4 border-gray-200 shadow-sm"
        >
      </div>
      <label class="mt-4 text-blue-500 cursor-pointer hover:underline">
        Choose a photo
        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
      </label>
      <div *ngIf="selectedFile" class="text-green-500 mt-1 text-xs truncate max-w-[160px]">
        ✔ {{ selectedFile.name }}
      </div>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="w-full space-y-6">
      <h2 class="font-bold text-xl text-gray-800">My Administrator Profile</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label>Last Name</label>
          <input formControlName="lastname" type="text">
        </div>
        <div>
          <label>First Name</label>
          <input formControlName="firstname" type="text">
        </div>
      </div>

      <div>
        <label>Email</label>
        <input formControlName="email" type="email">
        <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="text-red-500 text-sm mt-1">
          {{ profileForm.get('email')?.errors?.['required'] ? 'Email required' : 'Invalid format' }}
        </div>
      </div>

      <div class="border-t pt-4 mt-6">
        
        <div class="space-y-4">
          <div>
            <label>New password</label>
            <div class="relative">
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                formControlName="password"
                minlength="6"
                placeholder="Leave empty to keep current password"
                class="w-full"
              >
              <button type="button" (click)="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2" aria-label="Toggle password visibility">
                <fa-icon [icon]="showPassword ? faEyeSlash : faEye"></fa-icon>
              </button>
            </div>
            <div *ngIf="profileForm.get('password')?.value && profileForm.get('password')?.value.length < 6" class="text-red-500 text-sm mt-1">
              Minimum 6 characters
            </div>
          </div>

          <div>
            <label>Confirm new password</label>
            <div class="relative">
              <input 
                [type]="showConfirmPassword ? 'text' : 'password'" 
                formControlName="confirmPassword"
                placeholder="Confirm new password"
                class="w-full"
              >
              <button type="button" (click)="showConfirmPassword = !showConfirmPassword" class="absolute right-3 top-1/2 -translate-y-1/2" aria-label="Toggle password visibility">
                <fa-icon [icon]="showConfirmPassword ? faEyeSlash : faEye"></fa-icon>
              </button>
            </div>
            <div *ngIf="profileForm.hasError('passwordMismatch') && profileForm.get('confirmPassword')?.touched" class="text-red-500 text-sm mt-1">
              Passwords do not match
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-4 mt-6">
        <button type="button" (click)="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded transition-colors">CANCEL</button>
        <button type="submit" [disabled]="profileForm.invalid" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors">UPDATE</button>
      </div>
    </form>
  </div>
</div>

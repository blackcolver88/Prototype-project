<div class="dashboard-container">
  <h1 class="dashboard-title">Dashboard</h1>
  
  <div class="cards-container">

    <div class="stat-card bg-white p-6">
      <div class="flex items-center">
        <div class="flex-1">
          <p class="stat-title">Users</p>
          <h3 class="stat-value">
            {{ usersCount !== null ? usersCount : '...' }}
          </h3>
        </div>
        <div class="stat-icon bg-blue-100 text-blue-600">
          <i class="ni ni-single-02"></i>
        </div>
      </div>
    </div>

    <div class="stat-card bg-white p-6">
      <div class="flex items-center">
        <div class="flex-1">
          <p class="stat-title">Templates</p>
          <h3 class="stat-value">
            {{ templatesCount !== null ? templatesCount : '...' }}
          </h3>
        </div>
        <div class="stat-icon bg-purple-100 text-purple-600">
          <i class="ni ni-paper-diploma"></i>
        </div>
      </div>
    </div>

    <div class="stat-card bg-white p-6">
      <div class="flex items-center">
        <div class="flex-1">
          <p class="stat-title">Submissions</p>
          <h3 class="stat-value">
            {{ submissionsCount !== null ? submissionsCount : '...' }}
          </h3>
        </div>
        <div class="stat-icon bg-green-100 text-green-600">
          <i class="ni ni-check-bold"></i>
        </div>
      </div>
    </div>

    <div class="stat-card bg-white p-6">
      <div class="flex items-center">
        <div class="flex-1">
          <p class="stat-title">Processes</p>
          <h3 class="stat-value">
            {{ processesCount !== null ? processesCount : '...' }}
          </h3>
        </div>
        <div class="stat-icon bg-orange-100 text-orange-600">
          <i class="ni ni-briefcase-24"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8">
    <div class="chart-container">
      <h3 class="text-lg font-semibold mb-4">Statistics Overview</h3>
      <div style="height: 320px;">
        <canvas
          baseChart
          [datasets]="barChartData"
          [labels]="barChartLabels"
          [options]="barChartOptions"
          [legend]="barChartLegend"
          type="bar">
        </canvas>
      </div>
    </div>
  </div>

<div class="form-template-container">
    <div class="table-wrapper">
      <app-user-modal *ngIf="showModal" (close)="closeModal()" (userCreated)="onUserCreated($event)"></app-user-modal>
      <app-confirm-modal *ngIf="showConfirmModal"
                       [message]="confirmMessage"
                       (confirm)="confirmDelete()"
                       (cancel)="cancelDelete()"></app-confirm-modal>

      <div class="action-bar">
        <div class="button-container-centered">
          <button type="button" (click)="openDialog()" class="btn-add">
            <span class="btn-icon">+</span> Add new user
          </button>
        </div>
        <div class="pagination-controls">
          <div class="items-per-page">
            <label for="itemsPerPage">Items per page:</label>
            <select id="itemsPerPage" [(ngModel)]="itemsPerPage" (change)="onPageSizeChange()">
              <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
            </select>
          </div>
        </div>
      </div>

      <table class="form-table" *ngIf="isBrowser">
        <thead>
          <tr>
            <th class="table-header">Picture</th>
            <th class="table-header">First Name</th>
            <th class="table-header">Last Name</th>
            <th class="table-header">Email</th>
            <th class="table-header">Role</th>
            <th class="table-header">Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of rowData" class="form-row">
            <td class="table-cell photo-cell">
              <img *ngIf="user.photo" [src]="user.photo" alt="Photo de profil" class="user-photo" (error)="onImageError($event)">
              <div *ngIf="!user.photo" class="user-photo-placeholder">
                {{ user.firstname?.charAt(0) }}{{ user.lastname?.charAt(0) }}
              </div>
            </td>
            <td class="table-cell">{{ user.firstname }}</td>
            <td class="table-cell">{{ user.lastname }}</td>
            <td class="table-cell">{{ user.email }}</td>
            <td class="table-cell">{{ user.role }}</td>
            <td class="table-cell">
              <button (click)="handleDeleteClick(user.id || 0)" class="btn-delete" title="Delete User">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination" *ngIf="totalPages > 0">
        <div class="pagination-info">
          Showing {{ (currentPage - 1) * itemsPerPage + 1 }} to {{ getMaxItems() }} of {{ allUsers.length }} entries
        </div>
        <div class="pagination-buttons">
          <button class="pagination-button" [disabled]="currentPage === 1" (click)="previousPage()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <button *ngFor="let page of [].constructor(totalPages); let i = index"
                  class="pagination-button"
                  [class.active]="currentPage === i + 1"
                  (click)="goToPage(i + 1)">
            {{ i + 1 }}
          </button>

          <button class="pagination-button" [disabled]="currentPage === totalPages" (click)="nextPage()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

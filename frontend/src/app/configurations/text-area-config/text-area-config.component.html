<div class="flex flex-col md:flex-row md:space-x-8 p-4">
  <form [formGroup]="textArea" class="w-full md:w-1/2 space-y-4 mb-4 md:mb-0">
    <div class="space-y-2">
      <label for="label" class="block font-semibold">Label</label>
      <input
        id="label"
        formControlName="label"
        type="text"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Enter label text"
      />
      <div *ngIf="textArea.get('label')?.invalid && textArea.get('label')?.touched" 
           class="text-red-500">
        Label is required
      </div>
    </div>

    <div class="space-y-2">
      <label for="placeholder" class="block font-semibold">Placeholder</label>
      <input
        id="placeholder"
        formControlName="placeholder"
        type="text"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Enter placeholder text"
      />
    </div>

    <!-- Add Required toggle -->
    <div class="space-y-2">
      <label class="flex items-center space-x-2">
        <input type="checkbox" formControlName="isRequired" class="rounded">
        <span>Required</span>
      </label>
    </div>

    <div class="flex flex-col sm:flex-row sm:space-x-4 mt-4">
      <button
        type="submit"
        (click)="save()"
        class="w-full sm:w-auto text-white bg-green-500 hover:bg-green-600 p-2 rounded mb-2 sm:mb-0"
      >
        Save
      </button>
      <button
        type="button"
        (click)="cancel()"
        class="w-full sm:w-auto text-white bg-gray-500 hover:bg-gray-600 p-2 rounded"
      >
        Cancel
      </button>
    </div>
  </form>

  <div class="w-full md:w-1/2 border border-gray-300 p-4 rounded">
    <h3 class="font-semibold mb-2">Preview</h3>
    <app-text-area 
      [label]="textArea.get('label')?.value"
      [placeholder]="textArea.get('placeholder')?.value"
      [isRequired]="textArea.get('isRequired')?.value"
    ></app-text-area>
  </div>
</div>

<div class="p-4">
  <h2 class="text-xl font-bold mb-4">{{ inputType | titlecase }} Configuration</h2>
  
  <form [formGroup]="formInputForm" (ngSubmit)="save()" class="space-y-4">
    <!-- communs -->
    <div *ngFor="let field of commonFields" class="mb-3">
      <ng-container [ngSwitch]="field.type">

        <div *ngSwitchCase="'text'" class="form-group">
          <label [for]="field.name" class="block text-sm font-medium text-gray-700 mb-1">
            {{ field.label }}
            <span *ngIf="field.required" class="text-red-500">*</span>
          </label>
          <input 
            [type]="field.type" 
            [id]="field.name" 
            [formControlName]="field.name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            [required]="field.required">
          <div *ngIf="formInputForm.get(field.name)?.invalid && formInputForm.get(field.name)?.touched" class="text-red-500 text-sm mt-1">
            Ce champ est requis
          </div>
        </div>

        <!-- Checkbox -->
        <div *ngSwitchCase="'checkbox'" class="form-group">
          <div class="flex items-center">
            <input 
              type="checkbox" 
              [id]="field.name" 
              [formControlName]="field.name"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label [for]="field.name" class="ml-2 block text-sm text-gray-700">
              {{ field.label }}
            </label>
          </div>
        </div>
      </ng-container>
    </div>

    <ng-container *ngFor="let field of getFieldsByType(inputType)">
      <ng-container [ngSwitch]="field.type">

        <div *ngSwitchCase="'text'" class="form-group mb-3">
          <label [for]="field.name" class="block text-sm font-medium text-gray-700 mb-1">
            {{ field.label }}
            <span *ngIf="field.required" class="text-red-500">*</span>
          </label>
          <input 
            type="text" 
            [id]="field.name" 
            [formControlName]="field.name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            [required]="field.required">
        </div>


        <div *ngSwitchCase="'number'" class="form-group mb-3">
          <label [for]="field.name" class="block text-sm font-medium text-gray-700 mb-1">
            {{ field.label }}
            <span *ngIf="field.required" class="text-red-500">*</span>
          </label>
          <input 
            type="number" 
            [id]="field.name" 
            [formControlName]="field.name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            [required]="field.required">
        </div>

        <!-- Select -->
        <div *ngSwitchCase="'select'" class="form-group mb-3">
          <label [for]="field.name" class="block text-sm font-medium text-gray-700 mb-1">
            {{ field.label }}
            <span *ngIf="field.required" class="text-red-500">*</span>
          </label>
          <select 
            [id]="field.name" 
            [formControlName]="field.name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            [required]="field.required">
            <option *ngFor="let option of field.options" [value]="option.value">{{ option.label }}</option>
          </select>
        </div>

        <!-- Options ( checkbox, radio, select) -->
        <div *ngSwitchCase="'options'" class="form-group mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ field.label }}
            <span *ngIf="field.required" class="text-red-500">*</span>
          </label>
          
          <div formArrayName="options" class="space-y-2">
            <div *ngFor="let option of options.controls; let i = index" [formGroupName]="i" class="flex items-center space-x-2">
              <input 
                type="text" 
                formControlName="label" 
                placeholder="Option label" 
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 mb-2"
                required>

                <input 
                type="hidden" 
                formControlName="value">


            </div>
          </div>
          
          <button 
            type="button" 
            (click)="addOption()" 
            class="mt-2 px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            + Add Option
          </button>
        </div>
      </ng-container>
    </ng-container>


    <div class="flex justify-end space-x-2 mt-6">
      <button 
        type="button" 
        (click)="cancel()" 
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
        Cancel
      </button>
      <button 
        type="submit" 
        [disabled]="formInputForm.invalid"
        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 disabled:opacity-50 disabled:cursor-not-allowed">
        Save
      </button>
    </div>
  </form>
</div>

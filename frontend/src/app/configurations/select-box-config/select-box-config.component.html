<div class="flex flex-col md:flex-row md:space-x-8 p-4">
  <form
    [formGroup]="selectBoxForm"
    class="w-full md:w-1/2 space-y-4 mb-4 md:mb-0"
  >
    <div class="space-y-2">
      <label for="title" class="block font-semibold">Label Text</label>
      <input
        id="title"
        formControlName="title"
        type="text"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Enter field label"
      />
      <div
        *ngIf="
          selectBoxForm.get('title')?.invalid &&
          selectBoxForm.get('title')?.touched
        "
        class="text-red-500"
      >
        Label is required
      </div>
    </div>

    <div class="space-y-2">
      <label class="block font-semibold">Options</label>
      <div formArrayName="options" class="space-y-2">
        <div *ngFor="let option of options.controls; let i=index" [formGroupName]="i" class="flex space-x-2">
          <input formControlName="label" placeholder="Enter option text" class="flex-1 border border-gray-300 p-2 rounded" />
          <button type="button" (click)="removeOption(i)" class="text-red-500 px-2">×</button>
        </div>
      </div>
      <button type="button" (click)="addOption()" class="text-blue-500 mt-2">+ Add Option</button>
      <div
        *ngIf="
          selectBoxForm.get('options')?.invalid &&
          selectBoxForm.get('options')?.touched
        "
        class="text-red-500"
      >
        At least one option is required
      </div>
    </div>

    <!-- Add Required toggle -->
    <div class="space-y-2">
      <label class="flex items-center space-x-2">
        <input type="checkbox" formControlName="isRequired" class="rounded" />
        <span>Required</span>
      </label>
    </div>

    <div class="flex space-x-4 mt-4">
      <button
        type="button"
        (click)="save()"
        class="w-full sm:w-auto text-white bg-green-500 hover:bg-green-600 p-2 rounded"
      >
        Save
      </button>
      <button
        type="button"
        (click)="cancel()"
        class="w-full sm:w-auto text-white bg-gray-500 hover:bg-gray-600 p-2 rounded"
      >
        Cancel
      </button>
    </div>
  </form>

  <div class="w-full md:w-1/2 border border-gray-300 p-4 rounded">
    <h3 class="font-semibold mb-2">Preview</h3>
    <app-select-box
      [label]="selectBoxForm.value.title"
      [options]="optionLabels"
      [isRequired]="selectBoxForm.value.isRequired"
    ></app-select-box>
  </div>
</div>

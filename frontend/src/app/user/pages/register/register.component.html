<section class="bg-gray-50 dark:bg-gray-900">
  <div class="flex flex-col items-center px-6 pt-4 pb-8 mx-auto md:min-h-[80vh] lg:py-0">
      <div class="w-full bg-white rounded-lg shadow dark:border mt-4 sm:max-w-lg md:max-w-2xl xl:p-0 dark:bg-gray-800 dark:border-gray-700">
          <div class="p-4 md:p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                  Create a new user
              </h1>

              <!-- Display error message if any -->
              <div *ngIf="errorMessage" class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg dark:bg-red-200 dark:text-red-800">
                  {{ errorMessage }}
              </div>

              <!-- Display success message if any -->
              <div *ngIf="successMessage" class="p-4 mb-4 text-sm text-green-700 bg-green-100 rounded-lg dark:bg-green-200 dark:text-green-800">
                  {{ successMessage }}
              </div>

              <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6 md:space-y-8">
                  <!-- Grid layout for form fields - 2 columns -->
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                      <!-- First name - Column 1, Row 1 -->
                      <div>
                          <label for="firstname" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">First name</label>
                          <input type="text" formControlName="firstname" id="firstname" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="John">
                          <div *ngIf="f['firstname'].touched && f['firstname'].errors" class="text-red-500 text-sm mt-1">
                              <div *ngIf="f['firstname'].errors['required']">First name is required</div>
                          </div>
                      </div>

                      <!-- Last name - Column 2, Row 1 -->
                      <div>
                          <label for="lastname" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Last name</label>
                          <input type="text" formControlName="lastname" id="lastname" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Doe">
                          <div *ngIf="f['lastname'].touched && f['lastname'].errors" class="text-red-500 text-sm mt-1">
                              <div *ngIf="f['lastname'].errors['required']">Last name is required</div>
                          </div>
                      </div>

                      <!-- Email - Column 1, Row 2 -->
                      <div>
                          <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                          <input type="email" formControlName="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="name@company.com">
                          <div *ngIf="f['email'].touched && f['email'].errors" class="text-red-500 text-sm mt-1">
                              <div *ngIf="f['email'].errors['required']">Email is required</div>
                              <div *ngIf="f['email'].errors['email']">Please enter a valid email address</div>
                          </div>
                      </div>

                      <!-- Role - Column 2, Row 2 -->
                      <div>
                          <label for="role" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Role</label>
                          <select formControlName="role" id="role" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                              <option value="">Select a role</option>
                              <option value="ROLE_HR">HR</option>
                              <option value="ROLE_USER">User</option>
                          </select>
                          <div *ngIf="f['role'].touched && f['role'].errors" class="text-red-500 text-sm mt-1">
                              <div *ngIf="f['role'].errors['required']">Please select a role</div>
                          </div>
                      </div>

                      <!-- Password - Column 1, Row 3 -->
                      <div>
                          <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
                          <input type="password" formControlName="password" id="password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                          <div *ngIf="f['password'].touched && f['password'].errors" class="text-red-500 text-sm mt-1">
                              <div *ngIf="f['password'].errors['required']">Password is required</div>
                              <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
                          </div>
                      </div>

                      <!-- Confirm Password - Column 2, Row 3 -->
                      <div>
                          <label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirm password</label>
                          <input type="password" formControlName="confirmPassword" id="confirm-password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                          <div *ngIf="f['confirmPassword'].touched && (f['confirmPassword'].errors || registerForm.hasError('passwordMismatch'))" class="text-red-500 text-sm mt-1">
                              <div *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your password</div>
                              <div *ngIf="registerForm.hasError('passwordMismatch')">Passwords do not match</div>
                          </div>
                      </div>
                  </div>

                  <button type="submit" [disabled]="registerForm.invalid || isSubmitting"
                      class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
                      {{ isSubmitting ? 'Creating account...' : 'Create an account' }}
                  </button>
              </form>
          </div>
      </div>
  </div>
</section>

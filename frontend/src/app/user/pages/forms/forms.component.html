<div class="mt-5 mx-auto mr-5 max-w-[80%] transform -translate-x-[10%]">
  <ng-container *ngIf="isBrowser" class="z-4">
    <div class="flex justify-center mb-4">
      <h3 type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Forms list
      </h3>
    </div>

    <div class="flex justify-center w-full">
      <ag-grid-angular
        class="ag-theme-quartz"
        style="height: 500px; width: 90%;"
        [rowData]="rowData"
        [columnDefs]="colDefs"
        [rowSelection]="'single'">
      </ag-grid-angular>
    </div>
  </ng-container>
</div>


<div class="grid grid-cols-1 gap-4 items-start p-4 relative z-0">
  <div class="col-span-1 bg-white p-6 rounded-lg shadow-md w-full max-w-4xl mx-auto">
    <div class="flex justify-center">
      <h2 class="text-xl font-bold text-gray-700 mb-4">EditForm</h2>
    </div>
  
    <h3 *ngIf="formTitle" class="text-lg text-center text-gray-800 mb-4">{{ formTitle }}</h3>


    <div *ngIf="showValidationErrors && validationErrors.length > 0" class="mb-4">
      <div *ngFor="let error of validationErrors" class="text-red-500 text-sm">
        {{ error }}
      </div>
    </div>

    <div *ngIf="isLoading" class="text-center p-4">
    <span class="text-gray-500">Loading form...</span>
  </div>
  <ng-container *ngIf="!isLoading">
    <ng-template #recursiveSection let-items="items">
      <div *ngFor="let item of items" class="mb-4">
        <ng-container [ngSwitch]="item?.type">
          <!-- Section -->
          <ng-container *ngSwitchCase="'Section'">
            <div class="bg-white p-4 rounded-lg shadow-md">
              <div class="flex justify-between items-center mb-2">
                <h3 class="font-semibold text-gray-700">{{ item.title || 'Section' }}</h3>
              </div>

              <div *ngFor="let sectionItem of item.items" class="mb-2 relative z-0">
                <div class="bg-white p-3 rounded shadow-sm relative">
                  <!-- Text Field -->
                  <ng-container *ngIf="sectionItem?.type === 'TEXTFIELD'">
                      <app-textform 
                      [label]="sectionItem.config.label" 
                      [textName]="sectionItem.config.textName"
                      [type]="sectionItem.config.type" 
                      [placeholder]="sectionItem.config.placeholder"
                      [value]="sectionItem.value"  
                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-textform>
                    </ng-container>

                  <!-- Password Field -->
                  <ng-container *ngIf="sectionItem?.type === 'PASSWORD'">
                    <app-password 
                      [label]="sectionItem.config.label"
                      [placeholder]="sectionItem.config.placeholder"
                      [required]="sectionItem.config.required"
                      [value]="sectionItem.value"  
                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-password>
                  </ng-container>

                  <!-- Email -->
                  <ng-container *ngIf="sectionItem?.type === 'EMAIL'">
                    <app-email 
                      [label]="sectionItem.config.label" 
                      [type]="sectionItem.config.type" 
                      [placeholder]="sectionItem.config.placeholder"
                      [value]="sectionItem.value"  
                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-email>
                  </ng-container>

                  <!-- Checkbox Group -->
                  <ng-container *ngIf="sectionItem?.type === 'CHECKBOX'">
                    <app-checkbox 
                      [groupLabel]="sectionItem.config.label"
                      [name]="sectionItem.config.name" 
                      [options]="sectionItem.config.options"
                      [selectedOptions]="sectionItem.value"
                      (valueChange)="handleCheckboxChange(sectionItem.id, $event)"
                      >
                    </app-checkbox>
                  </ng-container>

                  <!-- Phone Number -->
                  <ng-container *ngIf="sectionItem?.type === 'NUMBER'">
                    <app-phone-number 
                      [label]="sectionItem.config.label"
                      [placeholder]="sectionItem.config.placeholder" 
                      [value]="sectionItem.value"  

                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-phone-number>
                  </ng-container>

                  <!-- Text Area -->
                  <ng-container *ngIf="sectionItem?.type === 'textarea'">
                      <app-text-area 
                      [label]="sectionItem.config.label" 
                      [placeholder]="sectionItem.config.placeholder"
                      [required]="sectionItem.config.required"
                      [value]="sectionItem.value"  
                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-text-area>
                  </ng-container>

                  <!-- Radio Group -->
                  <ng-container *ngIf="sectionItem?.type === 'RADIO_BUTTON'">
                    <app-radio-button
                      [groupLabel]="sectionItem.config.label"
                      [name]="sectionItem.config.name"
                      [options]="sectionItem.config.options"
                      [isRequired]="sectionItem.config.isRequired"
                      [isDisabled]="sectionItem.config.isDisabled"
                      [selectedOption]="sectionItem.value"
                      (valueChange)="handleRadioChange(sectionItem.id, $event)">
                    </app-radio-button>
                  </ng-container>

                  <!-- Select Box -->
                  <ng-container *ngIf="sectionItem?.type === 'SELECT_BOX'">
                    <app-select-box
                      [label]="sectionItem.config.label"
                      [options]="getOptionsArray(sectionItem.config.options)"
                      [value]="sectionItem.value"
                      (valueChange)="handleSelectBoxChange(sectionItem.id, $event)">
                    </app-select-box>
                  </ng-container>

                  <!-- Date Picker -->
                  <ng-container *ngIf="sectionItem?.type === 'datepicker'">
                    <app-datepicker 
                      [label]="sectionItem.config.label"
                      [value]="sectionItem.value"  
                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-datepicker>
                  </ng-container>

                  <!-- Basic Date Picker -->
                  <ng-container *ngIf="sectionItem?.type === 'basic_datepicker'">
                    <app-basic-datepicker 
                      [label]="sectionItem.config.label"
                      [value]="sectionItem.value"  
                      (valueChange)="handleInputChange(sectionItem.id, $event)">
                    </app-basic-datepicker>
                  </ng-container>
                </div>
              </div>
                  <!-- Subsection -->
            <div *ngIf="item.children?.length > 0" class="mt-4">
              <ng-container *ngFor="let subsection of item.children">
                <div *ngIf="subsection.type === 'Subsection'" class="bg-gray-100 p-4 rounded-lg shadow-sm mb-3">
                  <div class="flex justify-between items-center mb-2">
                    <h4 class="font-semibold text-gray-600">{{ subsection.title || 'Subsection' }}</h4>
                  </div>
                  
                  <div *ngFor="let subItem of subsection.items" class="mb-2">
                    <div class="bg-white p-3 rounded shadow-sm relative">
                      <!-- Text Field -->
                      <ng-container *ngIf="subItem?.type === 'TEXTFIELD'">
                        <app-textform 
                          [label]="subItem.config?.label || 'Text Field'" 
                          [textName]="subItem.config?.textName || ''"
                          [type]="subItem.config?.type || 'text'" 
                          [placeholder]="subItem.config?.placeholder || ''"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-textform>
                      </ng-container>
                      
                      <!-- Password Field -->
                      <ng-container *ngIf="subItem?.type === 'PASSWORD'">
                        <app-password 
                          [label]="subItem.config?.label || 'Password'"
                          [placeholder]="subItem.config?.placeholder || 'Enter password'"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-password>
                      </ng-container>
                      
                      <!-- Email Field -->
                      <ng-container *ngIf="subItem?.type === 'EMAIL'">
                        <app-email 
                          [label]="subItem.config?.label || 'Email'" 
                          [placeholder]="subItem.config?.placeholder || 'Enter email'"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-email>
                      </ng-container>
                      
                      <!-- Checkbox Group -->
                      <ng-container *ngIf="subItem?.type === 'CHECKBOX'">
                        <app-checkbox 
                          [groupLabel]="subItem.config?.label || 'Checkbox Group'"
                          [name]="subItem.config?.name || 'checkbox-group'" 
                          [options]="subItem.config?.options || []"
                          [isRequired]="subItem.config?.isRequired || false"
                          [selectedOptions]="subItem.value || []"
                          (valueChange)="handleCheckboxChange(subItem.id, $event)"
                        >
                        </app-checkbox>
                      </ng-container>
                      
                      <!-- Phone Number -->
                      <ng-container *ngIf="subItem?.type === 'NUMBER'">
                        <app-phone-number 
                          [label]="subItem.config?.label || 'Phone Number'"
                          [placeholder]="subItem.config?.placeholder || 'Enter phone number'"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-phone-number>
                      </ng-container>
                      
                      <!-- Text Area -->
                      <ng-container *ngIf="subItem?.type === 'textarea'">
                        <app-text-area 
                          [label]="subItem.config?.label || 'Text Area'"
                          [placeholder]="subItem.config?.placeholder || 'Enter text here'"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-text-area>
                      </ng-container>
                      
                      <!-- Radio Group -->
                      <ng-container *ngIf="subItem?.type === 'RADIO_BUTTON'">
                        <app-radio-button
                          [groupLabel]="subItem.config?.label || 'Radio Group'"
                          [name]="subItem.config?.name || 'radio-group'"
                          [options]="subItem.config?.options || []"
                          [isRequired]="subItem.config?.isRequired || false"
                          [selectedOption]="subItem.value || null"
                          (valueChange)="handleRadioChange(subItem.id, $event)"
                        >
                        </app-radio-button>
                      </ng-container>
                      
                      <!-- Select Box -->
                      <ng-container *ngIf="subItem?.type === 'SELECT_BOX'">
                        <app-select-box
                          [label]="subItem.config?.label || 'Select Option'"
                          [options]="getOptionsArray(subItem.config?.options) || []"
                          [value]="subItem.value || ''"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleSelectBoxChange(subItem.id, $event)"
                        >
                        </app-select-box>
                      </ng-container>
                      
                      <!-- Date Picker -->
                      <ng-container *ngIf="subItem?.type === 'datepicker'">
                        <app-datepicker 
                          [label]="subItem.config?.label || 'Select Date'"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-datepicker>
                      </ng-container>
                      
                      <!-- Basic Date Picker -->
                      <ng-container *ngIf="subItem?.type === 'basic_datepicker'">
                        <app-basic-datepicker 
                          [label]="subItem.config?.label || 'Select Date'"
                          [isRequired]="subItem.config?.isRequired || false"
                          (valueChange)="handleInputChange(subItem.id, $event)"
                        >
                        </app-basic-datepicker>
                      </ng-container>
                    </div>
                  </div>
                </div>
              </ng-container>
            </div>
            </div>
          </ng-container>

          <!-- Form  -->
          <ng-container *ngSwitchDefault>
            <div class="bg-white p-3 rounded shadow-sm relative">
              <!-- Text Field -->
              <ng-container *ngIf="item?.type === 'TEXTFIELD'">
                <app-textform 
                  [label]="item.config.label" 
                  [textName]="item.config.textName"
                  [type]="item.config.type" 
                  [placeholder]="item.config.placeholder">
                </app-textform>
              </ng-container>

              <!-- Password Field -->
              <ng-container *ngIf="item?.type === 'PASSWORD'">
                <app-password 
                  [label]="item.config.label"
                  [placeholder]="item.config.placeholder">
                </app-password>
              </ng-container>

              <!-- Email -->
              <ng-container *ngIf="item?.type === 'EMAIL'">
                <app-email 
                  [label]="item.config.label" 
                  [placeholder]="item.config.placeholder">
                </app-email>
              </ng-container>

              <!-- Checkbox Group -->
              <ng-container *ngIf="item?.type === 'CHECKBOX'">
                <app-checkbox
                  [groupLabel]="item.config.label"
                  [name]="item.config.name"
                  [options]="item.config.options"
                  [selectedOptions]="item.config.selectedOption"
                  (valueChange)="handleInputChange(item.id, $event)">
                </app-checkbox>
              </ng-container>

              <!-- Phone Number -->
              <ng-container *ngIf="item?.type === 'NUMBER'">
                <app-phone-number 
                  [label]="item.config.label"
                  [placeholder]="item.config.placeholder">
                </app-phone-number>
              </ng-container>

              <!-- Text Area -->
              <ng-container *ngIf="item?.type === 'textarea'">
                <app-text-area 
                  [label]="item.label">
                </app-text-area>
              </ng-container>

              <!-- Radio Group -->
              <ng-container *ngIf="item?.type === 'RADIO_BUTTON'">
                <app-radio-button
                  [groupLabel]="item.config.groupLabel"
                  [name]="item.config.name"
                  [options]="item.config.options"
                  [isRequired]="item.config.isRequired"
                  [isDisabled]="item.config.isDisabled"
                  [selectedOption]="item.config.selectedOption"
                  (valueChange)="handleInputChange(item.id, $event)">
                </app-radio-button>
              </ng-container>

              <!-- Select Box -->
              <ng-container *ngIf="item?.type === 'SELECT_BOX'">
                <app-select-box
                  [label]="item.config.labelText"
                  [options]="getOptionsArray(item.config.options)"
                  (valueChange)="handleInputChange(item.id, $event)">
                </app-select-box>
              </ng-container>

              <!-- Date Picker -->
              <ng-container *ngIf="item?.type === 'datepicker'">
                <app-datepicker 
                  [label]="item.config.label">
                </app-datepicker>
              </ng-container>

              <!-- Basic Date Picker -->
              <ng-container *ngIf="item?.type === 'basic_datepicker'">
                <app-basic-datepicker 
                  [label]="item.config.label">
                </app-basic-datepicker>
              </ng-container>

              <!-- Button -->
              <ng-container *ngIf="item?.type === 'button'">
                <app-button
                  [label]="item.config.label"
                  [type]="item.config.type">
                </app-button>
              </ng-container>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </ng-template>

    <ng-container *ngTemplateOutlet="recursiveSection; context: { items: editorItems }">
    </ng-container>


    <div *ngIf="editorItems.length > 0" class="flex justify-start mt-4 gap-4">
      <app-button
          label="Edit"
          type="submit"
          class="text-white bg-green-500 hover:bg-green-600 px-4 py-2 rounded-md transition-all duration-200 shadow hover:shadow-md"
          (click)="onSubmit()">
      </app-button>
  
      <app-button
          label="Cancel"
          type="reset"
         class="text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 px-4 py-2 rounded-md transition-all duration-200 shadow hover:shadow-md"
          (click)="onCancel()">
      </app-button>
  </div>


    

  </ng-container>
</div>

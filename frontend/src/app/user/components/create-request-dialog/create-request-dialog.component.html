<div class="dialog-container">
  <div class="dialog-header">
    <h2 style="font-size: 22px;">Create New Request</h2>
    <button type="button" class="close-btn" (click)="onCancel()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="dialog-content">
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading available forms and roles...</p>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading && !errorMessage">
      <div class="form-group">
        <label for="formId" class="form-label" style="font-size: 18px; margin-bottom: 10px;">
          Select Form <span class="required">*</span>
        </label>
        <select 
          id="formId" 
          formControlName="formId" 
          class="form-select"
          style="font-size: 16px; height: 48px; padding: 10px 16px; margin-bottom: 15px;"
          [class.error]="isFieldInvalid('formId')">
          <option value="">Choose a form...</option>
          <option *ngFor="let form of availableForms" [value]="form.id">
            {{ form.title }}
          </option>
        </select>
        <div class="error-text" *ngIf="getFormError('formId')">
          {{ getFormError('formId') }}
        </div>
      </div>

      <div class="form-group">
        <label for="targetRole" class="form-label" style="font-size: 18px; margin-bottom: 10px;">
          Target Approval Role <span class="required">*</span>
        </label>
        <select 
          id="targetRole" 
          formControlName="targetRole" 
          class="form-select"
          style="font-size: 16px; height: 48px; padding: 10px 16px; margin-bottom: 15px;"
          [class.error]="isFieldInvalid('targetRole')">
          <option value="">Choose a role...</option>
          <option *ngFor="let role of availableRoles" [value]="role">
            {{ role.replace('ROLE_', '') | titlecase }}
          </option>
        </select>
        <div class="error-text" *ngIf="getFormError('targetRole')">
          {{ getFormError('targetRole') }}
        </div>
        <div class="help-text" style="font-size: 14px;">
          Select the role of the person who will review and approve your request.
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" style="font-size: 15px; padding: 10px 16px;" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn-submit" style="font-size: 15px; padding: 10px 16px; font-weight: 500;" [disabled]="requestForm.invalid">
          Continue to Form
        </button>
      </div>
    </form>
  </div>
</div>

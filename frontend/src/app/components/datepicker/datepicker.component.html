<div class="datepicker">
  <div class="relative">
    <label for="datepicker" class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
    <div class="flex items-center bg-gray-100 border border-gray-300 rounded px-2 py-1">
      <input
        id="datepicker"
        type="text"
        placeholder="MM/DD/YYYY - MM/DD/YYYY"
        [(ngModel)]="value"
        class="bg-gray-100 outline-none text-gray-900 w-full"
        readonly
        (click)="toggleCalendar()"
        (input)="onInputChange($event)"
      />
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor" (click)="toggleCalendar()">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-8 4h8m2 0a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V9a2 2 0 012-2h12z" />
      </svg>
      <button *ngIf="value" class="ml-1 text-gray-400 hover:text-gray-600" (click)="clearSelection(); $event.stopPropagation()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div *ngIf="showCalendar" class="absolute bg-white border border-gray-300 rounded-lg shadow-lg mt-1 z-10 w-64">
      <div class="p-4">
        <!-- Calendar Header -->
        <div class="flex justify-between items-center">
          <button (click)="prevMonth(); $event.stopPropagation()" class="text-gray-600 hover:bg-gray-100 rounded-full p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <span class="text-gray-700 font-medium">{{ currentMonth | date: 'MMMM yyyy' }}</span>
          <button (click)="nextMonth(); $event.stopPropagation()" class="text-gray-600 hover:bg-gray-100 rounded-full p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- Calendar Days -->
        <div class="grid grid-cols-7 gap-1 mt-4 text-center">
          <span *ngFor="let day of weekDays" class="text-gray-600 font-medium font-medium">{{ day }}</span>
          <ng-container *ngFor="let date of daysInMonth">
            <div 
              class="p-2 rounded-full cursor-pointer hover:bg-gray-200"
              [class.opacity-50]="!isCurrentMonthDate(date)"
              [class.hover:bg-gray-200]="!isInRange(date)"
              (click)="selectDate(date)">
              {{ date.getDate() }}
            </div>
          </ng-container>
        </div>

        <div class="flex justify-between mt-4">
          <button 
            class="text-sm text-gray-600 hover:text-gray-800" 
            (click)="clearSelection(); $event.stopPropagation()">
            Clear
          </button>
          <button 
            class="text-sm bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600" 
            (click)="closeCalendar()">
            Apply
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
